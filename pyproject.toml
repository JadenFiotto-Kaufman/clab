[project]
name = "nnspec"
version = "0.0.1"
description = "Runs interpretability experiments on transformer LMs from declarative JSON documents."
requires-python = ">=3.10"
dependencies = [
    "nnsight>=0.8.2",
    "nnterp",
    "torch",
    "safetensors",
    "pydantic",
    "accelerate",
    "datasets>=4",
]

[project.scripts]
nnspec = "nnspec.cli:main"

[dependency-groups]
dev = ["pytest", "bitsandbytes>=0.50"]

# nnsight comes from PyPI; nnterp is an editable checkout at the path below until nnterp 2 publishes. Leave the
# nnterp entry alone; add your own dependencies above as needed.
[tool.uv.sources]
nnterp = { path = "/home/localjadenfk/wd/nnterp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["/home/localjadenfk/wd/nnterp"]
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
include = ["nnspec*"]
